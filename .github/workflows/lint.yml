name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # ./... leaves out dot directories, so the spec suite is named.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./... ./.regenerate
